---
name: GitHub Actions Version Updater (GAVU)
on:
  workflow_call:
    secrets:
      WORKFLOW_SECRET:
        required: true
jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
      - name: run github actions version updater
        uses: saadmk11/github-actions-version-updater@v0.9.0
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
